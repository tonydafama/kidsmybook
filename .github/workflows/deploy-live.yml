# Push to main → build → (optional) Wrangler deploy kidsmybook.com
# Set repo secret CLOUDFLARE_API_TOKEN for automatic live deploy.
name: Deploy live

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Wrangler deploy
        id: wrangler
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a5305840219e568d113495a70265631d
          command: deploy
      - name: Deploy skipped (no Cloudflare token)
        if: steps.wrangler.outcome != 'success'
        run: |
          echo "::warning::Live deploy skipped (missing or invalid CLOUDFLARE_API_TOKEN). Build still passed. Deploy locally: npm run build && npx wrangler deploy"
      - name: Smoke check homepage
        if: steps.wrangler.outcome == 'success'
        run: |
          sleep 8
          html="$(curl -fsSL 'https://kidsmybook.com/')"
          echo "$html" | rg -q 'data-hero="v2"' || (echo 'Homepage missing hero v2 marker' && exit 1)