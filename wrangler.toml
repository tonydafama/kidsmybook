name = "mybook-kids"
main = "worker/index.ts"
compatibility_date = "2026-08-05"
workers_dev = false
account_id = "a5305840219e568d113495a70265631d"

[[kv_namespaces]]
binding = "kidsmybook_leads"
id = "ee8d200a425a45fbba808eb6383b3e44"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run worker first for ALL routes so we can enforce canonical domain redirects
run_worker_first = true
[[routes]]
pattern = "kidsmybook.com/*"
zone_id = "d815252f7819e38a94d61f166aed2a69"

[[routes]]
pattern = "www.kidsmybook.com/*"
zone_id = "d815252f7819e38a94d61f166aed2a69"

[[routes]]
pattern = "mybook.pub/*"
zone_id = "0c3761137e946af97dd4019636c0f140"

[[routes]]
pattern = "www.mybook.pub/*"
zone_id = "0c3761137e946af97dd4019636c0f140"
