        },
        {
          "@type": "Question",

        },
        {
          "@type": "Question",
          "name": "書可唔可以喺實體書店上架？",
          "acceptedAnswer": { "@type": "Answer", "text": "計劃目標係正式印刷，再走實體書店平台上架路徑（例如三聯、商務、中華等安排，視題材同配套）。Kidsmybook 唔係三聯、商務或中華。店長決定入貨、陳列同退貨，唔保證每間分店都有。ISBN 本身亦唔等於書架上架。詳見 https://kidsmybook.com/kids-book-bookstore-listing 。" }
        },
        {
          "@type": "Question",
          "name": "Kidsmybook 點樣幫小朋友考入香港好學校？",
          "acceptedAnswer": { "@type": "Answer", "text": "香港頂尖國際學校同私立學校，每年收到好多份一模一樣嘅 Portfolio（鋼琴、游水、奧數）。Kidsmybook 幫家庭做出一本由小朋友親自參與、大學教授審閱嘅正式出版實體書，證明熱情、專注同學術潛力，令面試官更容易記住。" }
        },

          "@type": "Question",
